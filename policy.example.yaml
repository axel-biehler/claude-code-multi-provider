# Copy to policy.yaml (gitignored) and edit — absent file means these defaults.
#
# Every field is optional: a partial policy.yaml only overrides what it names,
# the rest keeps the defaults shown here (this file matches them exactly).

# Engine chain priority order: the first entry receives every delegated job;
# later entries are automatic fallbacks on quota exhaustion or auth failure.
# Antigravity, Kimi, and Mammouth are available for inclusion anywhere in this chain.
chain:
  - codex
  - claude

# Upper bound on delegated jobs running at the same time (1-8).
maxConcurrentJobs: 2

# Per-engine worker tuning.
workers:
  codex:
    # Optional; when omitted, uses the locally configured default from
    # `~/.codex/config.toml`.
    # model: gpt-5.6-sol
    # Optional per-effort model tiers. delegate_task's `effort` hint
    # (light|standard|heavy) selects a tier; an unset tier falls back to
    # `model` above. Omit `models` entirely to always use `model`.
    # models:
    #   light: gpt-5.6-sol
    #   heavy: gpt-5.6-sol
    # Optional reasoning values: minimal|low|medium|high|xhigh. A scalar
    # applies to all tiers, a map is per-tier, and absent uses the provider
    # CLI's own default.
    # reasoning:
    #   light: low
    #   standard: medium
    #   heavy: high
    # Scalar alternative: reasoning: high
    timeoutMs: 600000 # kill the worker after 10 minutes
  claude:
    model: sonnet # alias, and the fallback when no tier matches
    # Aliases track the latest model in each tier (fable, opus, sonnet, haiku),
    # so they never go stale.
    # Optional per-effort tiers (see the codex note above).
    # models:
    #   light: haiku
    #   standard: sonnet
    #   heavy: opus
    # Optional reasoning values: low|medium|high|xhigh|max. A scalar applies
    # to all tiers, a map is per-tier, and absent uses the provider CLI's own
    # default.
    # reasoning:
    #   light: low
    #   standard: high
    #   heavy: max
    # Scalar alternative: reasoning: high
    maxBudgetUsd: 2 # per-job spend cap
    timeoutMs: 600000
  antigravity:
    # Optional; falls back to the Antigravity CLI's configured default.
    # Run `agy models` for the live catalog, newest first.
    # model: gemini-3.6-flash-high
    # model: claude-sonnet-4-6
    # Optional per-effort tiers (see the codex note above).
    # models:
    #   light: gemini-3.6-flash-high
    #   standard: claude-sonnet-4-6
    #   heavy: gemini-3.6-flash-high
    # Optional reasoning values: low|medium|high. A scalar applies to all
    # tiers, a map is per-tier, and absent uses the provider CLI's own default.
    # reasoning:
    #   light: low
    #   standard: medium
    #   heavy: high
    # Scalar alternative: reasoning: high
    timeoutMs: 600000
  kimi:
    # Optional; falls back to the Kimi CLI's login-populated default.
    # model: kimi-model-id
    # Optional per-effort tiers (see the codex note above).
    # models:
    #   light: kimi-light-model-id
    #   standard: kimi-standard-model-id
    #   heavy: kimi-heavy-model-id
    # kimi has no reasoning flag — effort tiers use the models map only.
    timeoutMs: 600000
  mammouth:
    # Optional; falls back to the Mammouth CLI's configured default.
    # Run `mammouth models` for provider/model ids such as opencode/big-pickle.
    # model: opencode/big-pickle
    # Optional per-effort tiers (see the codex note above).
    # models:
    #   light: opencode/big-pickle
    #   standard: opencode/big-pickle
    #   heavy: opencode/big-pickle
    # Optional reasoning values: minimal|low|medium|high|max. Values are passed
    # to the Mammouth CLI as --variant; a scalar applies to all tiers, a map is
    # per-tier, and absent uses the provider CLI's own default.
    # reasoning:
    #   light: low
    #   standard: medium
    #   heavy: high
    # Scalar alternative: reasoning: high
    timeoutMs: 600000

# Per-engine quota budgets. Hitting a budget marks the engine exhausted for
# the cooldown window; the router skips it and tries the next engine.
quotas:
  codex:
    maxJobsPer5h: 10
    maxJobsPerWeek: 50
    exhaustionCooldownMinutes: 60
  claude:
    maxJobsPer5h: 10
    maxJobsPerWeek: 50
    exhaustionCooldownMinutes: 60
  antigravity:
    maxJobsPer5h: 10
    maxJobsPerWeek: 50
    exhaustionCooldownMinutes: 60
  kimi:
    maxJobsPer5h: 10
    maxJobsPerWeek: 50
    exhaustionCooldownMinutes: 60
  mammouth:
    maxJobsPer5h: 10
    maxJobsPerWeek: 50
    exhaustionCooldownMinutes: 60

# Retention for job artifacts and worktrees (.delegate/), used by GC.
retention:
  maxAgeDays: 7 # prune jobs older than this...
  keepLast: 10 # ...but always keep the N most recent
